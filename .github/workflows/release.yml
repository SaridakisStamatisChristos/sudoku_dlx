name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test-matrix:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - name: Run full test suite
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest -q

  build-attach:
    name: Validate, build, and attach distributions
    runs-on: ubuntu-latest
    needs: test-matrix
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build and docs dependencies
        run: |
          python -m pip install -U pip build twine
          python -m pip install -e ".[dev]"

      - name: Verify deterministic search-work baseline
        run: python bench/regression.py

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Verify tag matches package version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python tools/version_guard.py --tag "$GITHUB_REF_NAME"

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Clean wheel install and import
        run: |
          python -m venv /tmp/sudoku-release-smoke
          /tmp/sudoku-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/sudoku-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/sudoku-release-smoke/bin/python -c "import sudoku_dlx as s; print('import ok; version:', s.__version__)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
