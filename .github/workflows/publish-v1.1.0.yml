name: publish-v1.1.0

on:
  push:
    branches: ["aether/publish-v1.1.0"]

permissions:
  contents: read

jobs:
  test-matrix:
    name: Release test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dda9bbd8667e83c762f17236295945ce8df3f341
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - name: Run full test suite
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest -q

  build-release:
    name: Build and publish v1.1.0
    runs-on: ubuntu-latest
    needs: test-matrix
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dda9bbd8667e83c762f17236295945ce8df3f341
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install release dependencies
        run: |
          python -m pip install -U pip build twine
          python -m pip install -e ".[dev]"
      - name: Verify deterministic search-work baseline
        run: python bench/regression.py
      - name: Build documentation strictly
        run: mkdocs build --strict
      - name: Verify package version
        run: python tools/version_guard.py --tag "v1.1.0"
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Clean wheel install and import
        run: |
          python -m venv /tmp/sudoku-v110-release-smoke
          /tmp/sudoku-v110-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/sudoku-v110-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/sudoku-v110-release-smoke/bin/python -c "import sudoku_dlx as s; assert s.__version__ == '1.1.0'; print('release import ok:', s.__version__)"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sudoku_dlx-v1.1.0-dist
          path: dist/*
      - name: Create GitHub Release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          target_commitish: dda9bbd8667e83c762f17236295945ce8df3f341
          name: sudoku_dlx v1.1.0
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
