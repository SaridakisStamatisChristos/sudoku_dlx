name: pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/configure-pages@v4

      - name: Install site dependencies
        run: |
          python -m pip install -U pip build
          python -m pip install -e ".[dev]"

      - name: Build browser wheel
        run: python -m build --wheel

      - name: Assemble demo and documentation site
        run: |
          rm -rf _pages
          mkdir -p _pages/assets
          cp -R web/. _pages/
          cp dist/*.whl _pages/assets/
          python - <<'PY'
          import glob
          import json
          import os
          from pathlib import Path
          import sudoku_dlx

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          manifest = {
              "version": sudoku_dlx.__version__,
              "filename": os.path.basename(wheels[0]),
          }
          Path("_pages/assets/wheel.json").write_text(
              json.dumps(manifest, separators=(",", ":")), encoding="utf-8"
          )
          PY
          mkdocs build --strict --site-dir _pages/docs

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
