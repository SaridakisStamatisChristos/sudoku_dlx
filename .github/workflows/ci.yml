name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - name: Run unit and integration tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest -q --maxfail=1 --disable-warnings --cov=sudoku_dlx --cov-report=xml -m "not prop"
      - name: Deterministic search-work regression gate
        if: matrix.python-version == '3.12'
        run: python bench/regression.py
      - name: Build docs strictly
        if: matrix.python-version == '3.12'
        run: mkdocs build --strict
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  cross-platform:
    name: Smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - name: Run core smoke tests
        run: >-
          pytest -q --disable-warnings
          tests/test_api.py tests/test_solver.py tests/test_v1_invariants.py
          -m "not prop"

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -U pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/sudoku-wheel-smoke
          /tmp/sudoku-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/sudoku-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/sudoku-wheel-smoke/bin/python -c "import sudoku_dlx; print(sudoku_dlx.__version__)"
